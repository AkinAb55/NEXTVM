name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Основная сборка
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # Lint + детект проблем
      - name: Run Lint
        if: always()
        run: ./gradlew lint --no-daemon || true

      # Опционально: сборка Release (без подписи)
      - name: Build Release APK (unsigned)
        if: github.ref == 'refs/heads/main'
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # Загрузка артефактов
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nextvm-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK (unsigned)
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nextvm-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      # Отчеты
      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
          retention-days: 7
